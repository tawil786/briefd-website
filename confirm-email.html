<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Verifying your Briefd. account…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body style="font-family: -apple-system, sans-serif; background: #0a0a0a; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <p>Opening Briefd.…</p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const tokenHash = params.get('token_hash');
    const type = params.get('type') || 'email';
    if (tokenHash) {
      window.location.href = `briefd://auth/callback?token_hash=${encodeURIComponent(tokenHash)}&type=${encodeURIComponent(type)}`;
    }
  </script>
</body>
</html>
